openapi: 3.0.3
info:
  title: Forum Framework API
  version: "1.0.0"
  description: |
    API REST do Forum Framework. Todas as respostas usam o envelope
    {success, data, error, meta}. Rotas protegidas usam Bearer JWT
    (POST /auth/login). Este arquivo é gerado por scripts/gen-openapi.mjs.
servers:
  - url: http://localhost:8080/api/v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        meta:
          type: object
          nullable: true
          properties:
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
  responses:
    Ok:
      description: Sucesso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Error:
      description: Erro (400 corpo inválido, 401, 403, 404, 409, 422 validação, 429 limite)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
paths:
  /admin/audit:
    get:
      tags: ["admin/audit"]
      summary: "list"
      operationId: "get_admin_audit"
      description: "Permissão exigida: logs.view."
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /admin/audit/actions:
